name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write   # nécessaire pour publier une release sur un tag v*

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Build du jar
        run: ./gradlew --no-daemon jar

      - name: Jar en artefact
        uses: actions/upload-artifact@v4
        with:
          name: bm-bigtrade
          path: build/libs/bm-bigtrade.jar
          if-no-files-found: error

      # Un tag vX.Y.Z publie le jar dans les Releases.
      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: build/libs/bm-bigtrade.jar
